spring.application.name=flightService
server.port=18888

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/passenger_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=swami123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# gRPC server configuration
grpc.server.port=11112
grpc.server.security.enabled=false
grpc.server.max-inbound-message-size=4194304

# Logging configuration (reduced for production safety)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.flightService=INFO
